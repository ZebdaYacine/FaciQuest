# Static host for the compiled Flutter web bundle. TLS and the public hostname
# are Traefik's job in front of this container, so this server is plain :80.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Container-local only; used by HEALTHCHECK and Dokploy.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Flutter routes client-side, so any unknown path must return index.html
    # rather than 404 — otherwise a hard refresh on /users breaks the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames, so they can be cached hard.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|otf|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # These three must NOT be cached. index.html and the service worker point at
    # the hashed assets; a stale copy pins a returning user to the previous
    # deploy indefinitely. .env is an asset too, so a cached one keeps the old
    # API URL alive after a repoint.
    location = /index.html            { add_header Cache-Control "no-store"; }
    location = /flutter_service_worker.js { add_header Cache-Control "no-store"; }
    location = /assets/.env           { add_header Cache-Control "no-store"; }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;
}
